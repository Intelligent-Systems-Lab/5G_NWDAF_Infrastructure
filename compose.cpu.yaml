# CPU runtime policy override. The selected complete config must also set both
# FL client training devices to CPU.
services:
  pymtlf-a:
    runtime: runc
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      NVIDIA_DRIVER_CAPABILITIES: void
  pymtlf-b:
    runtime: runc
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      NVIDIA_DRIVER_CAPABILITIES: void
