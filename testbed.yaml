schemaVersion: 1
name: dual-tai-default

config:
  directory: config/default

guest:
  box: ubuntu/jammy64
  boxVersion: 20241002.0.0
  os: ubuntu
  release: "22.04"

hostSafety:
  reserveMemoryMiB: 6144
  containerBuildOverheadMemoryMiB: 2048
  minimumGpuMemoryMiB: 8192
  swapPolicy: warn
  minimumFreeSwapMiB: 1024
  minimumFreeStorageGiB: 120

machines:
  core:
    resources: {memoryMiB: 4096, cpus: 4, diskGiB: 40}
    interfaces:
      management: 192.168.56.10
      sbi: 192.168.57.2
      n2: 192.168.58.2
      n4: 192.168.61.2
  path-a:
    resources: {memoryMiB: 3072, cpus: 3, diskGiB: 40}
    interfaces:
      management: 192.168.56.11
      sbi: 192.168.57.3
      n2: 192.168.58.3
      n3-a: 192.168.59.2
      n4: 192.168.61.3
      n6-a: 192.168.62.2
  path-b:
    resources: {memoryMiB: 3072, cpus: 3, diskGiB: 40}
    interfaces:
      management: 192.168.56.12
      sbi: 192.168.57.4
      n2: 192.168.58.4
      n3-b: 192.168.60.2
      n4: 192.168.61.4
      n6-b: 192.168.63.2

networks:
  management: {cidr: 192.168.56.0/24, mode: private}
  sbi: {cidr: 192.168.57.0/24, mode: private}
  n2: {cidr: 192.168.58.0/24, mode: private}
  n3-a: {cidr: 192.168.59.0/24, mode: private}
  n3-b: {cidr: 192.168.60.0/24, mode: private}
  n4: {cidr: 192.168.61.0/24, mode: private}
  n6-a: {cidr: 192.168.62.0/24, mode: private, egress: nat}
  n6-b: {cidr: 192.168.63.0/24, mode: private, egress: nat}

mobileNetwork:
  # Canonical MCC/MNC source. config-create derives every NF/RAN PLMN, TAI,
  # 15-digit IMSI SUPI, Internal Group ID, Consumer target, and fixture from it.
  plmn: {mcc: "466", mnc: "92"}
  snssai: {sst: 1, sd: "010203"}
  dnn: internet
  # TS 23.003/29.571 Group ID = serviceId-MCC-MNC-localId. GPSI/MSISDN is a
  # separate subscriber identity and is deliberately not derived from PLMN.
  internalGroup: {serviceId: "00000001", localId: "01"}

placement:
  core:
    - nrf
    - nssf
    - udr
    - udm
    - ausf
    - pcf
    - amf
    - smf
    - mongodb
    - adrf
    - nwdaf-c
    - nwdaf-consumer
  path-a: [upf-a, gnb-a, ue1, ue2, ue3, nwdaf-a]
  path-b: [upf-b, gnb-b, ue4, ue5, ue6, nwdaf-b]
  host-containers: [pyanlf-a, pymtlf-a, pyanlf-b, pymtlf-b, pymtlf-c]

optionalServices:
  webconsole:
    machine: core
    endpoint: {network: management, address: 192.168.56.10, port: 5000}

mlRuntime:
  engine: docker-compose-v2
  networkMode: bridge
  bindAddress: 192.168.57.1
  advertisedAddress: 192.168.57.1
  services:
    pyanlf-a: {image: pyanlf, publishedPort: 9093, containerPort: 9093, device: cpu, cpus: 1.0, memoryMiB: 768, volume: {name: pyanlf-a-artifacts, target: /opt/app/artifacts}}
    pyanlf-b: {image: pyanlf, publishedPort: 9094, containerPort: 9093, device: cpu, cpus: 1.0, memoryMiB: 768, volume: {name: pyanlf-b-artifacts, target: /opt/app/artifacts}}
    pymtlf-a: {image: pymtlf, publishedPort: 9092, containerPort: 9092, device: "cuda:0", cpus: 2.0, memoryMiB: 1536, volume: {name: pymtlf-a-data, target: /var/lib/5g-nwdaf-infrastructure/pymtlf-a}}
    pymtlf-b: {image: pymtlf, publishedPort: 9091, containerPort: 9092, device: "cuda:0", cpus: 2.0, memoryMiB: 1536, volume: {name: pymtlf-b-data, target: /var/lib/5g-nwdaf-infrastructure/pymtlf-b}}
    pymtlf-c: {image: pymtlf, publishedPort: 9292, containerPort: 9292, device: cpu, cpus: 1.0, memoryMiB: 1024, volume: {name: pymtlf-c-data, target: /var/lib/5g-nwdaf-infrastructure/pymtlf-c}}

coreServices:
  nrf:
    sbi: {network: sbi, address: 192.168.57.10, port: 8000}
  nssf:
    sbi: {network: sbi, address: 192.168.57.11, port: 8000}
  udr:
    sbi: {network: sbi, address: 192.168.57.12, port: 8000}
  udm:
    sbi: {network: sbi, address: 192.168.57.13, port: 8000}
  ausf:
    sbi: {network: sbi, address: 192.168.57.14, port: 8000}
  pcf:
    sbi: {network: sbi, address: 192.168.57.15, port: 8000}
  amf:
    sbi: {network: sbi, address: 192.168.57.16, port: 8000}
    n2: {network: n2, address: 192.168.58.10, port: 38412}
  smf:
    sbi: {network: sbi, address: 192.168.57.17, port: 8000}
    n4: {network: n4, address: 192.168.61.10, port: 8805}
  mongodb:
    endpoint: {network: sbi, address: 192.168.57.18, port: 27017}
    database: free5gc
  adrf:
    nfInstanceId: a0494f77-36db-4639-9f6f-e3e71fb5bfe6
    sbi: {network: sbi, address: 192.168.57.19, port: 9888}
    mongodb: {database: adrf}
    modelStorage:
      localDirectory: /var/lib/5g-nwdaf-infrastructure/adrf/models

paths:
  a:
    machine: path-a
    tai: {tac: "000001"}
    gnb:
      n2: {network: n2, address: 192.168.58.20}
      n3: {network: n3-a, address: 192.168.59.20}
    upf:
      n3: {network: n3-a, address: 192.168.59.10}
      n4: {network: n4, address: 192.168.61.20}
      n6: {network: n6-a, address: 192.168.62.10}
      eventExposure: {network: sbi, address: 192.168.57.40, port: 8088}
      gtpInterface: upfgtp-a
      uePool: 10.60.0.0/16
      pseudoDriver:
        enabled: true
        mode: hybrid
        dataset:
          file: traffic.parquet
          guestDirectory: /var/lib/5g-nwdaf-infrastructure/datasets/active
          minimumReplayHeadroomMiB: 512
    # Stable local ordinals; renderer zero-pads the MSIN so MCC+MNC+MSIN is
    # always a 15-digit IMSI for either a 2- or 3-digit MNC.
    subscriberNumbers: [1, 2, 3]
  b:
    machine: path-b
    tai: {tac: "000002"}
    gnb:
      n2: {network: n2, address: 192.168.58.30}
      n3: {network: n3-b, address: 192.168.60.20}
    upf:
      n3: {network: n3-b, address: 192.168.60.10}
      n4: {network: n4, address: 192.168.61.30}
      n6: {network: n6-b, address: 192.168.63.10}
      eventExposure: {network: sbi, address: 192.168.57.50, port: 8088}
      gtpInterface: upfgtp-b
      uePool: 10.61.0.0/16
      pseudoDriver:
        enabled: true
        mode: hybrid
        dataset:
          file: traffic.parquet
          guestDirectory: /var/lib/5g-nwdaf-infrastructure/datasets/active
          minimumReplayHeadroomMiB: 512
    subscriberNumbers: [4, 5, 6]

analytics:
  topology: production-flat
  nwdaf-a:
    machine: path-a
    nfInstanceId: "11111111-1111-4111-8111-111111111111"
    sbi: {network: sbi, address: 192.168.57.41, port: 8080}
    tai: "000001"
    role: fl-client
    backends: {anlf: pyanlf-a, mtlf: pymtlf-a}
  nwdaf-b:
    machine: path-b
    nfInstanceId: "22222222-2222-4222-8222-222222222222"
    sbi: {network: sbi, address: 192.168.57.51, port: 8080}
    tai: "000002"
    role: fl-client
    backends: {anlf: pyanlf-b, mtlf: pymtlf-b}
  nwdaf-c:
    machine: core
    nfInstanceId: "33333333-3333-4333-8333-333333333333"
    sbi: {network: sbi, address: 192.168.57.30, port: 8080}
    role: fl-server
    backends: {mtlf: pymtlf-c}
  backends:
    pyanlf-a: {runtime: host-container, address: 192.168.57.1, port: 9093}
    pyanlf-b: {runtime: host-container, address: 192.168.57.1, port: 9094}
    pymtlf-a: {runtime: host-container, address: 192.168.57.1, port: 9092}
    pymtlf-b: {runtime: host-container, address: 192.168.57.1, port: 9091}
    pymtlf-c: {runtime: host-container, address: 192.168.57.1, port: 9292}

consumer:
  machine: core
  requesterNfType: AF
  discovery:
    nrf: nrf
    serviceName: nnwdaf-eventssubscription
    event: UE_COMMUNICATION
  target:
    # Internal Group ID is derived from mobileNetwork.internalGroup and PLMN.
    paths: [a, b]
  callback:
    network: sbi
    bindAddress: 192.168.57.32
    advertisedAddress: 192.168.57.32
    port: 9090
    path: /callbacks/nwdaf
  reporting: {method: PERIODIC, periodSeconds: 30}

security: {tls: false, oauth: false}
operations:
  clockSkewToleranceMs: 1000
  journalMaxUseMiB: 512
  pyanlfDelivery:
    analyticsReportTimeoutSeconds: 120
    analyticsWorkerStopTimeoutSeconds: 300
    accuracyReportTimeoutSeconds: 120
    runtimeCompletionTimeoutSeconds: 30
