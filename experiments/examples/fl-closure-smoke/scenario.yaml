schemaVersion: 2
name: fl-closure-smoke
kind: bounded-smoke
warmStartMode: inference-and-training
samplingIntervalSeconds: 30
trafficProfiles:
  a: traffic/path-a.json
  b: traffic/path-b.json
monitoring:
  reportPeriodSeconds: 90
  minimumReferenceReports: 2
  decisionWindowSize: 2
  requiredHits: 1
training:
  minimumSamples: 1
  localEpochs: 2
  fittingRounds: 2
  preparationDataWindowSeconds: 3600
  closureBudgetSeconds: 300
  enforcePerformanceGate: false
