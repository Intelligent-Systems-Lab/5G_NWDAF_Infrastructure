name: 5g-nwdaf-infrastructure
services:
  pyanlf-a:
    init: true
    restart: 'no'
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    networks:
    - ml
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    image: 5g-nwdaf-infrastructure/pyanlf:local
    build:
      context: ${REPOSITORY_ROOT:?REPOSITORY_ROOT must be set}
      dockerfile: containers/ml/Dockerfile
      target: pyanlf
      args:
        COMPONENT_REVISION: 6a4d94ad3cc6f66dac55ea921772d731e4b71371
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      NNPACK_DISABLE: '1'
      MALLOC_ARENA_MAX: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      SERVICE_PORT: '9093'
    cpus: 1.0
    mem_limit: 768m
    ports:
    - target: 9093
      published: '9093'
      host_ip: ${ML_BIND_ADDRESS:-192.168.57.1}
      protocol: tcp
    volumes:
    - type: bind
      source: ${CONFIG_DIR:-.}/pyanlf-a.yaml
      target: /etc/5g-nwdaf/config.yaml
      read_only: true
    - type: volume
      source: pyanlf-a-artifacts
      target: /opt/app/artifacts
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['SERVICE_PORT']
        + '/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    labels:
      io.5g-nwdaf.service: pyanlf-a
      io.5g-nwdaf.config-set: ${CONFIG_SET_NAME:-default}
      io.5g-nwdaf.config-hash: ${CONFIG_HASH:-unresolved}
  pymtlf-a:
    init: true
    restart: 'no'
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    networks:
    - ml
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    image: 5g-nwdaf-infrastructure/pymtlf:local
    build:
      context: ${REPOSITORY_ROOT:?REPOSITORY_ROOT must be set}
      dockerfile: containers/ml/Dockerfile
      target: pymtlf
      args:
        COMPONENT_REVISION: 36166f04320ae70674604659786ba73935371426
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      NNPACK_DISABLE: '1'
      MALLOC_ARENA_MAX: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      SERVICE_PORT: '9092'
      NVIDIA_VISIBLE_DEVICES: nvidia.com/gpu=all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    cpus: 2.0
    mem_limit: 1536m
    ports:
    - target: 9092
      published: '9092'
      host_ip: ${ML_BIND_ADDRESS:-192.168.57.1}
      protocol: tcp
    volumes:
    - type: bind
      source: ${CONFIG_DIR:-.}/pymtlf-a.yaml
      target: /etc/5g-nwdaf/config.yaml
      read_only: true
    - type: volume
      source: pymtlf-a-data
      target: /var/lib/5g-nwdaf-infrastructure/pymtlf-a
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['SERVICE_PORT']
        + '/health/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    labels:
      io.5g-nwdaf.service: pymtlf-a
      io.5g-nwdaf.config-set: ${CONFIG_SET_NAME:-default}
      io.5g-nwdaf.config-hash: ${CONFIG_HASH:-unresolved}
    runtime: nvidia
  pyanlf-b:
