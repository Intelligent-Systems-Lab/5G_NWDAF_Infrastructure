info: {version: 1.0.7, description: dual-TAI SMF with Nupf Event Exposure}
configuration:
  smfName: SMF
  sbi: {scheme: http, registerIPv4: 192.168.57.17, bindingIPv4: 192.168.57.17, port: 8000}
  serviceNameList: [nsmf-pdusession, nsmf-event-exposure, nsmf-oam, nsmf-callback]
  snssaiInfos:
    - sNssai: {sst: 1, sd: "010203"}
      dnnInfos:
        - dnn: internet
          dns: {ipv4: 8.8.8.8, ipv6: "2001:4860:4860::8888"}
  plmnList: [{mcc: "466", mnc: "92"}]
  locality: dual-tai
  pfcp:
    nodeID: 192.168.61.10
    listenAddr: 192.168.61.10
    externalAddr: 192.168.61.10
    assocFailAlertInterval: 10s
    assocFailRetryInterval: 30s
    heartbeatInterval: 10s
  userplaneInformation:
    upNodes:
      gNB-A: {type: AN, anIP: 192.168.58.20}
      gNB-B: {type: AN, anIP: 192.168.58.30}
      UPF-A:
        type: UPF
        nodeID: 192.168.61.20
        addr: 192.168.61.20
        tais: [{plmnId: {mcc: "466", mnc: "92"}, tac: "000001"}]
        nupfEeApiRoot: http://192.168.57.40:8088
        sNssaiUpfInfos:
          - sNssai: {sst: 1, sd: "010203"}
            dnnUpfInfoList: [{dnn: internet, pools: [{cidr: 10.60.0.0/16}]}]
        interfaces: [{interfaceType: N3, endpoints: [192.168.59.10], networkInstances: [internet]}]
      UPF-B:
        type: UPF
        nodeID: 192.168.61.30
        addr: 192.168.61.30
        tais: [{plmnId: {mcc: "466", mnc: "92"}, tac: "000002"}]
        nupfEeApiRoot: http://192.168.57.50:8088
        sNssaiUpfInfos:
          - sNssai: {sst: 1, sd: "010203"}
            dnnUpfInfoList: [{dnn: internet, pools: [{cidr: 10.61.0.0/16}]}]
        interfaces: [{interfaceType: N3, endpoints: [192.168.60.10], networkInstances: [internet]}]
    links: [{A: gNB-A, B: UPF-A}, {A: gNB-B, B: UPF-B}]
  eventExposure:
    staticSessionResolution: {enabled: false, sessions: []}
  t3591: {enable: true, expireTime: 16s, maxRetryTimes: 3}
  t3592: {enable: true, expireTime: 16s, maxRetryTimes: 3}
  nrfUri: http://192.168.57.10:8000
  urrPeriod: 30
  urrThreshold: 500000
  requestedUnit: 1000
logger: {enable: true, level: info, reportCaller: false}

