  serviceNameList: [nnssf-nsselection, nnssf-nssaiavailability]
  nrfUri: http://192.168.57.10:8000
  supportedPlmnList: [{mcc: "466", mnc: "92"}]
  supportedNssaiInPlmnList:
    - plmnId: {mcc: "466", mnc: "92"}
      supportedSnssaiList: [{sst: 1, sd: "010203"}]
