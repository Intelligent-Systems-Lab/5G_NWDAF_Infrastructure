      accessType: 3GPP_ACCESS
      supportedSnssaiList: [{sst: 1, sd: "010203"}]
    - tai: {plmnId: {mcc: "466", mnc: "92"}, tac: "000002"}
      accessType: 3GPP_ACCESS
      supportedSnssaiList: [{sst: 1, sd: "010203"}]
  mappingListFromPlmn: []
logger: {enable: true, level: info, reportCaller: false}

