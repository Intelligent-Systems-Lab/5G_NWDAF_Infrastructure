    commit: e784ce6e02e62dad834b42e669e9de731ac9583f
    license: Apache-2.0
  componentNativeConfigs: components.lock.yaml
constraints:
  certificatesSupported: false
  pseudoDriverRequired: true
  pseudoDriverProfiles:
    a: fixtures/full-core/traffic/profiles/path-a.json
    b: fixtures/full-core/traffic/profiles/path-b.json
  gtp5g: ">=0.9.5,<0.10.0"
runtime:
  guestMachines: [core, path-a, path-b]
  hostContainers: [pyanlf-a, pymtlf-a, pyanlf-b, pymtlf-b, pymtlf-c]
datasets:
  path-a:
    profile: fixtures/full-core/traffic/profiles/path-a.json
    guestDirectory: /var/lib/5g-nwdaf-infrastructure/datasets/active
  path-b:
    profile: fixtures/full-core/traffic/profiles/path-b.json
    guestDirectory: /var/lib/5g-nwdaf-infrastructure/datasets/active
