schemaVersion: 1

# Copy this file to testbed.local.yaml. These settings describe the physical
# host and provider only; topology semantics belong in an explicit testbed file.
provider:
  name: virtualbox
  # Optional drift guard. When set, it must equal VirtualBox's current default
  # machine folder. The actual folder is always checked for free space.
  expectedVmStorage: null

# The public topology publishes ML endpoints on its isolated Host SBI address.
# Override only the physical bind address when this provider exposes that Host
# address differently. It must still route to mlRuntime.advertisedAddress from
# every VM; do not use a public/laboratory LAN address by default.
host:
  mlBindAddress: 192.168.57.1
  dockerDataRoot: /var/lib/docker

# Select one complete config set for every machine. Relative paths are resolved
# from the repository root.
config:
  directory: config/default
