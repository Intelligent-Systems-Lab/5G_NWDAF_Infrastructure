# Validation-only override. The generated smoke config changes both FL clients
# to CPU; this file returns them to runc and disables NVIDIA device injection.
services:
  pymtlf-a:
    runtime: runc
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      NVIDIA_DRIVER_CAPABILITIES: void
  pymtlf-b:
    runtime: runc
    environment:
      NVIDIA_VISIBLE_DEVICES: void
      NVIDIA_DRIVER_CAPABILITIES: void
