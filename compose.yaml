name: 5g-nwdaf-infrastructure

x-runtime: &runtime
  init: true
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  networks: [ml]
  logging:
    driver: local
    options: {max-size: 10m, max-file: "3"}

x-environment: &environment
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  NNPACK_DISABLE: "1"
  MALLOC_ARENA_MAX: "2"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

x-healthcheck-pyanlf: &healthcheck-pyanlf
  test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9093/health/ready', timeout=2).read()"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

x-healthcheck-pymtlf: &healthcheck-pymtlf
  test: [CMD, python, -c, "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['SERVICE_PORT'] + '/health/ready', timeout=2).read()"]
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 30s

services:
  pyanlf-a:
    <<: *runtime
    image: 5g-nwdaf-infrastructure/pyanlf:local
    build:
      context: .
      dockerfile: containers/ml/Dockerfile
      target: pyanlf
      args:
        COMPONENT_REVISION: 08798f15c3693027e00bc60dd53f74ebaa26c3a1
    environment: *environment
    cpus: 1.0
    mem_limit: 768m
    ports:
      - {target: 9093, published: "${PYANLF_A_PORT:-9093}", host_ip: "${ML_BIND_ADDRESS:-192.168.57.1}", protocol: tcp}
    volumes:
      - {type: bind, source: "${CONFIG_DIR:-./config/default}/pyanlf-a.yaml", target: /etc/5g-nwdaf/config.yaml, read_only: true}
      - {type: volume, source: pyanlf-a-artifacts, target: /opt/app/artifacts}
    healthcheck: *healthcheck-pyanlf
    labels:
      io.5g-nwdaf.service: pyanlf-a
      io.5g-nwdaf.config-set: "${CONFIG_SET_NAME:-default}"
      io.5g-nwdaf.config-hash: "${CONFIG_HASH:-unresolved}"

  pyanlf-b:
    <<: *runtime
    image: 5g-nwdaf-infrastructure/pyanlf:local
    build:
      context: .
      dockerfile: containers/ml/Dockerfile
      target: pyanlf
      args:
        COMPONENT_REVISION: 08798f15c3693027e00bc60dd53f74ebaa26c3a1
    environment: *environment
    cpus: 1.0
    mem_limit: 768m
    ports:
      - {target: 9093, published: "${PYANLF_B_PORT:-9094}", host_ip: "${ML_BIND_ADDRESS:-192.168.57.1}", protocol: tcp}
    volumes:
      - {type: bind, source: "${CONFIG_DIR:-./config/default}/pyanlf-b.yaml", target: /etc/5g-nwdaf/config.yaml, read_only: true}
      - {type: volume, source: pyanlf-b-artifacts, target: /opt/app/artifacts}
    healthcheck: *healthcheck-pyanlf
    labels:
      io.5g-nwdaf.service: pyanlf-b
      io.5g-nwdaf.config-set: "${CONFIG_SET_NAME:-default}"
      io.5g-nwdaf.config-hash: "${CONFIG_HASH:-unresolved}"

  pymtlf-a:
    <<: *runtime
    runtime: nvidia
    image: 5g-nwdaf-infrastructure/pymtlf:local
    build:
      context: .
      dockerfile: containers/ml/Dockerfile
      target: pymtlf
      args:
        COMPONENT_REVISION: 7e8ab7f23bf5d6398eb1cd5f053dd8bda9439a87
    environment:
      <<: *environment
      SERVICE_PORT: "9092"
      NVIDIA_VISIBLE_DEVICES: "nvidia.com/gpu=all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    cpus: 2.0
    mem_limit: 1536m
    ports:
      - {target: 9092, published: "${PYMTLF_A_PORT:-9092}", host_ip: "${ML_BIND_ADDRESS:-192.168.57.1}", protocol: tcp}
    volumes:
      - {type: bind, source: "${CONFIG_DIR:-./config/default}/pymtlf-a.yaml", target: /etc/5g-nwdaf/config.yaml, read_only: true}
      - {type: volume, source: pymtlf-a-data, target: /var/lib/5g-nwdaf-infrastructure/pymtlf-a}
    healthcheck: *healthcheck-pymtlf
    labels:
      io.5g-nwdaf.service: pymtlf-a
      io.5g-nwdaf.config-set: "${CONFIG_SET_NAME:-default}"
      io.5g-nwdaf.config-hash: "${CONFIG_HASH:-unresolved}"

  pymtlf-b:
    <<: *runtime
    runtime: nvidia
    image: 5g-nwdaf-infrastructure/pymtlf:local
    build:
      context: .
      dockerfile: containers/ml/Dockerfile
      target: pymtlf
      args:
        COMPONENT_REVISION: 7e8ab7f23bf5d6398eb1cd5f053dd8bda9439a87
    environment:
      <<: *environment
      SERVICE_PORT: "9092"
      NVIDIA_VISIBLE_DEVICES: "nvidia.com/gpu=all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    cpus: 2.0
    mem_limit: 1536m
    ports:
      - {target: 9092, published: "${PYMTLF_B_PORT:-9091}", host_ip: "${ML_BIND_ADDRESS:-192.168.57.1}", protocol: tcp}
    volumes:
      - {type: bind, source: "${CONFIG_DIR:-./config/default}/pymtlf-b.yaml", target: /etc/5g-nwdaf/config.yaml, read_only: true}
      - {type: volume, source: pymtlf-b-data, target: /var/lib/5g-nwdaf-infrastructure/pymtlf-b}
    healthcheck: *healthcheck-pymtlf
    labels:
      io.5g-nwdaf.service: pymtlf-b
      io.5g-nwdaf.config-set: "${CONFIG_SET_NAME:-default}"
      io.5g-nwdaf.config-hash: "${CONFIG_HASH:-unresolved}"

  pymtlf-c:
    <<: *runtime
    image: 5g-nwdaf-infrastructure/pymtlf:local
    build:
      context: .
      dockerfile: containers/ml/Dockerfile
      target: pymtlf
      args:
        COMPONENT_REVISION: 7e8ab7f23bf5d6398eb1cd5f053dd8bda9439a87
    environment:
      <<: *environment
      SERVICE_PORT: "9292"
      PYMTLF_SEED_SOURCE: /opt/app/seed_models/initial
      PYMTLF_SEED_MODEL_ID: "1"
      PYMTLF_SEED_INTEROPERABILITY: "001122"
      PYMTLF_SEED_ARTIFACT_KEY: a2c796a001e2da2461418f80b01d7d1e33f0e3349c2817d92286f09e67aa6bef
    cpus: 1.0
    mem_limit: 1024m
    ports:
      - {target: 9292, published: "${PYMTLF_C_PORT:-9292}", host_ip: "${ML_BIND_ADDRESS:-192.168.57.1}", protocol: tcp}
    volumes:
      - {type: bind, source: "${CONFIG_DIR:-./config/default}/pymtlf-c.yaml", target: /etc/5g-nwdaf/config.yaml, read_only: true}
      - {type: volume, source: pymtlf-c-data, target: /var/lib/5g-nwdaf-infrastructure/pymtlf-c}
    healthcheck: *healthcheck-pymtlf
    labels:
      io.5g-nwdaf.service: pymtlf-c
      io.5g-nwdaf.config-set: "${CONFIG_SET_NAME:-default}"
      io.5g-nwdaf.config-hash: "${CONFIG_HASH:-unresolved}"

networks:
  ml:
    driver: bridge

volumes:
  pyanlf-a-artifacts:
  pyanlf-b-artifacts:
  pymtlf-a-data:
  pymtlf-b-data:
  pymtlf-c-data:
